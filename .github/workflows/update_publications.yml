name: Generate Publications from BibTeX

on:
  push:
    paths:
      - 'assets/publications.bib'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Generate publications HTML
      run: python scripts/generate_publications.py

    - name: Commit and push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add publications.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update publications from BibTeX" && git push)
